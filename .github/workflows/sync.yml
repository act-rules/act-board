name: Sync ACT board

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Require GitHub App secrets
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
        run: |
          if [ -z "$APP_ID" ] || [ -z "$APP_PRIVATE_KEY" ]; then
            echo "APP_ID and APP_PRIVATE_KEY must be set as repository Actions secrets."
            exit 1
          fi

      - uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: act-rules
          repositories: |
            act-board
            act-rules.github.io

      - uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}

      - uses: actions/checkout@v4
        with:
          repository: act-rules/act-tools
          path: act-tools
          token: ${{ steps.app-token.outputs.token }}

      - uses: actions/checkout@v4
        with:
          repository: act-rules/act-rules.github.io
          path: act-rules.github.io
          token: ${{ steps.app-token.outputs.token }}

      - uses: actions/checkout@v4
        with:
          repository: w3c/wcag-act-rules
          path: wcag-act-rules

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: yarn
          cache-dependency-path: act-tools/yarn.lock

      - name: Install act-tools
        working-directory: act-tools
        run: |
          corepack enable
          yarn install --immutable

      - name: Classify, upsert, sync Project, write snapshot
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          ACT_BOARD_PROJECT_NUMBER: ${{ vars.ACT_BOARD_PROJECT_NUMBER }}
        working-directory: act-tools
        run: |
          if [ -z "$ACT_BOARD_PROJECT_NUMBER" ]; then
            echo "Set repository variable ACT_BOARD_PROJECT_NUMBER to the Projects v2 number."
            exit 1
          fi
          yarn approval-report \
            --rulesDir ../act-rules.github.io/_rules \
            --glossaryDir ../act-rules.github.io/pages/glossary \
            --testAssetsDir ../act-rules.github.io/test-assets \
            --actRulesRepo ../act-rules.github.io \
            --wcagActRulesDir ../wcag-act-rules \
            --outFile ../approval-report.json
          yarn upsert-act-board --input ../approval-report.json
          yarn sync-act-board-project --input ../approval-report.json
          yarn write-act-board-snapshot \
            --input ../approval-report.json \
            --outFile ../data/snapshot.json

      - name: Commit snapshot when it changed
        run: |
          git add data/snapshot.json
          if git diff --cached --quiet; then
            echo "snapshot.json unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update classifier snapshot"
          git push
